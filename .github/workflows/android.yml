name: android-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (no wrapper in repo)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Assemble release APK (unsigned)
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menuisierdz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: menuisierdz-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*[\x27\x22]\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          {
            echo "# MenuisierDZ v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"; echo ""
            echo "- Version: ${APP_VERSION}+${APP_CODE}"; echo "- Commit: ${GITHUB_SHA}"
            echo "- DZ 2026 OpenPencil pass (FR/AR labels on rail+bar nav icons)."
            echo "- Debug APK is installable; release APK is unsigned (test only)."; echo ""
            echo "## Files"; find app/build/outputs/apk -name '*.apk' -printf '- %f (%s bytes)\n'
          } > release-notes.md
          cat release-notes.md

      - name: Publish APKs to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: MenuisierDZ v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          bodyFile: release-notes.md
          artifacts: "app/build/outputs/apk/debug/*.apk,app/build/outputs/apk/release/*.apk"
